[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regenesis-cmi"
version = "0.1.0"
description = "Synthetic validation of conditional-mutual-information instruments for Regenesis E2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Research use; project license not yet selected"}
authors = [{name = "Regenesis research project"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.6,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pytest-cov>=4,<7"]

[project.scripts]
regenesis-cmi = "regenesis_cmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

