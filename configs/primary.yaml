name: primary
output_dir: results/primary
seeds:
  start: 1000
  count: 100
null_calibration_seeds:
  start: 20000
  count: 40

exact:
  sample_sizes: [50, 100, 200, 328, 500, 1000]

dimension_benchmark:
  dimensions: [1, 2, 4, 8]
  sample_size: 1500
  k_fraction: 0.08

sample_size_benchmark:
  sample_sizes: [100, 200, 328, 500, 1000]
  worlds: ["null", genuine_cortical]
  window: post
  n_subjects: 1

causal:
  # Five causal seeds keep the experiment-shaped 12-subject core CPU-safe;
  # the exact core above receives the full 100-seed bias characterization.
  seeds: [1101, 1201, 1301, 1401, 1501]
  worlds: ["null", redundant, genuine_cortical, artifact_only, cortical_plus_artifact]
  windows: [pre, post]
  generator:
    target_name: intended_grasp_type
    n_grasp_types: 4
    n_subjects: 12
    trials_per_subject: 328
    blocks_per_subject: 8
    eeg_channels: 32
    emg_channels: 5
    band_labels: [low, mu, beta, high]
    mode: debug
    default_proxy_quality: 0.7
  oracle:
    precision_bits: 0.003
    min_samples: 20000
    max_samples: 200000
    batch_size: 10000
  decoder:
    outer_splits: 4
    inner_splits: 3
    c_grid: [0.03, 0.1, 0.3, 1.0, 3.0]
  direct_eeg_dimensions: 12
  direct_emg_dimensions: 5
  mixed_k_fraction: 0.06

controls:
  honesty_worlds: [artifact_only, genuine_cortical, cortical_plus_artifact]
  degradation_worlds: [artifact_only, genuine_cortical, cortical_plus_artifact]
  proxy_worlds: [artifact_only, cortical_plus_artifact]
  richness_worlds: [redundant, cortical_plus_artifact]
  montage_band_worlds: [artifact_only, genuine_cortical, cortical_plus_artifact]
  surrogate_worlds: [artifact_only, genuine_cortical, cortical_plus_artifact]
  default_proxy_quality: 0.7
  degradation_levels: [1.0, 0.75, 0.5, 0.25, 0.0]
  proxy_qualities: [1.0, 0.9, 0.7, 0.5, 0.0]
  surrogate_label_permutations: 19
  surrogate_trials_per_subject: 512

scientific_matrix:
  principle: "Targeted contrasts, not a full Cartesian product"
  true_effects: [zero, very_small, small, medium, large]
  artifact_strengths: [none, weak, medium, strong]
  cortical_strengths: [none, weak, medium, strong]
  dimension_families: [reduced, default, high]
  note: "Named causal worlds anchor the interpretable effects; generic dimension sweeps isolate estimator stress."
